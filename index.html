<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Tamu Desa Kesiut</title>
    <style>
        /* Reset & Font Modern */
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-image: url('https://github.com/operatordesakesiut-hash/BukuTamuDesa/blob/main/KantorDesa.jpeg?raw=true'); 
            background-size: cover;       
            background-position: center;  
            background-repeat: no-repeat; 
            background-attachment: fixed; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 15px;
        }

        /* Container Glassmorphism Modern */
        .container {
           background: linear-gradient(to bottom, #ffffff 0%, rgba(255, 255, 255, 0.77) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 480px;
            border: 1px solid rgba(255, 255, 255, 0.4);

             isolation: isolate; 
        }

        /* 2. Kode Logo pilihan Anda yang sudah disempurnakan */
        .logo-container img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            background: transparent;
            
            /* Menghilangkan warna putih (Transparan) */
            mix-blend-mode: multiply;
            
            /* TRIK RAHASIA: 
            Kombinasi ini memaksa warna putih 'kotor/abu-abu tipis' di gambar 
            berubah menjadi Putih Murni (#FFFFFF) sehingga LENGYAP di-multiply! */
            filter: contrast(125%) brightness(105%); 
        }

        h2 {
            text-align: center;
            color: #1a252f;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            margin-top: 5px;
        }

        /* Group Form */
        .form-group {
            margin-bottom: 16px;
        }
        label.field-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
            font-size: 13.5px;
        }

        /* Styling Input Field Modern */
        input[type="text"], 
        input[type="tel"], 
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #d1d5db;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            background: #ffffff;
            transition: all 0.25s ease;
            color: #222;
        }
        input[type="text"]:focus, 
        input[type="tel"]:focus, 
        textarea:focus {
            border-color: #28a745;
            box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.15);
            outline: none;
        }

        /* Custom Radio Box (Pill Style) */
        .radio-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 6px;
        }
        .radio-option {
            position: relative;
        }
        .radio-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }
        .radio-card {
            display: block;
            text-align: center;
            padding: 10px;
            background: #f3f4f6;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #4b5563;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .radio-option input[type="radio"]:checked + .radio-card {
            background: #e8f5e9;
            border-color: #28a745;
            color: #1b5e20;
        }

        .kategori-info {
            margin-top: 8px;
            padding: 8px 12px;
            background: #f8fafc;
            border-left: 3px solid #28a745;
            border-radius: 4px;
            font-size: 11.5px;
            color: #64748b;
            line-height: 1.4;
        }

        /* Section Kamera Custom */
        .camera-container {
            text-align: center;
            margin-top: 20px;
            padding: 16px;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            background-color: #f8fafc;
        }
        .custom-file-upload {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: #ffffff;
            border: 1.5px solid #28a745;
            color: #28a745;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .custom-file-upload:hover {
            background: #28a745;
            color: #ffffff;
        }
        input[type="file"] {
            display: none; /* Sembunyikan input file asli browser */
        }
        .camera-container img {
            width: 100%;
            max-width: 300px;
            border-radius: 8px;
            margin-top: 12px;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Tombol Submit Modern */
        .btn {
            background-color: #28a745;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            margin-top: 20px;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
            transition: all 0.2s ease;
        }
        .btn:hover {
            background-color: #218838;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(40, 167, 69, 0.4);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn:disabled {
            background-color: #9ca3af;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="https://github.com/operatordesakesiut-hash/BukuTamuDesa/blob/main/KopDesaKesiut.png?raw=true" alt="Logo Desa Kesiut">
    </div>

    <h1></h1>
    <h2>Formulir Buku Tamu Desa Kesiut</h2>
    <form id="guestbookForm">

        <!-- Pilihan Kategori Modern -->
        <div class="form-group">
            <label class="field-label">Kategori Kunjungan:</label>
            <div class="radio-container">
                <label class="radio-option">
                    <input type="radio" id="kategori_umum" name="kategori" value="Umum" required checked>
                    <span class="radio-card">👤 Umum</span>
                </label>
                <label class="radio-option">
                    <input type="radio" id="kategori_khusus" name="kategori" value="Khusus">
                    <span class="radio-card">🏛️ Khusus</span>
                </label>            
            </div>

            <div class="kategori-info">
                • <b>Umum:</b> Warga perorangan / masyarakat umum.<br>
                • <b>Khusus:</b> Perwakilan Instansi / Lembaga / Tamu Dinas.
            </div>
        </div>

        <!-- Form Nama Instansi / Lembaga / Perorangan -->
        <div class="form-group" id="containerInstansi">
            <label class="field-label" for="namaInstansiLembaga">Nama Instansi / Lembaga / Perorangan Yang Diwakili:</label>
            <input type="text" id="namaInstansiLembaga" name="namaInstansiLembaga" required placeholder="Contoh: Dinas / Pribadi / Komunitas">
        </div>
        
        <div class="form-group">
            <label class="field-label" for="nama">Nama Lengkap:</label>
            <input type="text" id="nama" name="nama" required placeholder="Contoh: Budi Santoso">
        </div>

        <div class="form-group">
            <label class="field-label" for="alamat">Alamat:</label>
            <textarea id="alamat" name="alamat" rows="2" required placeholder="Masukkan alamat lengkap"></textarea>
        </div>

        <div class="form-group">
            <label class="field-label" for="jabatan">Jabatan / Pekerjaan:</label>
            <input type="text" id="jabatan" name="jabatan" required placeholder="Contoh: Manager / Wiraswasta">
        </div>

        <div class="form-group">
            <label class="field-label" for="tujuan">Tujuan Kunjungan:</label>
            <input type="text" id="tujuan" name="tujuan" required placeholder="Contoh: Rapat koordinasi / Kunjungan kerja">
        </div>

        <div class="form-group">
            <label class="field-label" for="no_wa">No WA / Telepon:</label>
            <input type="tel" id="no_wa" name="no_wa" required placeholder="Contoh: 081234567890">
        </div>

        <div class="form-group">
            <label class="field-label" for="saran">Saran dan Masukan:</label>
            <textarea id="saran" name="saran" rows="3" required placeholder="Tulis saran & masukan Anda di sini"></textarea>
        </div>

        <!-- Bagian Kamera Custom -->
        <div class="camera-container">
            <label class="field-label" style="margin-bottom: 10px;">📸 Dokumentasi Foto Diri (Wajib)</label>
            
            <label for="cameraInput" class="custom-file-upload">
                📷 Ambil / Upload Foto Diri
            </label>
            <input type="file" id="cameraInput" accept="image/*" capture="user" required>
            
            <img id="photoPreview" alt="Hasil Foto Dokumentasi">
            <input type="hidden" id="photoData" name="photoData" required>
        </div>

        <button type="submit" class="btn" id="submitBtn">Kirim Data Kunjungan</button>
    </form>
</div>

<script>
    // URL Web App Google Apps Script Anda
    const scriptURL = 'https://script.google.com/macros/s/AKfycbykymIvZ0IJ7WUDFBqt4zjixXg6aoEkRstgJA1iFlQ1EcBBp0Y1V85XszjJcr9fn-3WEg/exec'; 

    const cameraInput = document.getElementById('cameraInput');
    const photoPreview = document.getElementById('photoPreview');
    const photoDataInput = document.getElementById('photoData');
    const form = document.getElementById('guestbookForm');
    const submitBtn = document.getElementById('submitBtn');

    // 1. Kompresi Foto Otomatis
    cameraInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    let width = img.width;
                    let height = img.height;
                    const max_size = 600;
                    
                    if (width > height) {
                        if (width > max_size) {
                            height *= max_size / width;
                            width = max_size;
                        }
                    } else {
                        if (height > max_size) {
                            width *= max_size / height;
                            height = max_size;
                        }
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const dataURL = canvas.toDataURL('image/jpeg', 0.7);
                    photoPreview.src = dataURL;
                    photoPreview.style.display = 'block';
                    photoDataInput.value = dataURL; 
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    });

    // 2. Fungsi Kirim Form ke Google Sheets
    form.addEventListener('submit', (e) => {
        e.preventDefault(); 
        
        if (!photoDataInput.value) {
            alert("Mohon ambil foto dokumentasi diri Anda terlebih dahulu!");
            return;
        }

        submitBtn.innerText = "⏳ Sedang Menyimpan Data...";
        submitBtn.disabled = true;

        const kategoriSelected = document.querySelector('input[name="kategori"]:checked')?.value || '';

        const payload = {
            kategori: kategoriSelected,
            nama: document.getElementById('nama')?.value || '',
            alamat: document.getElementById('alamat')?.value || '',
            jabatan: document.getElementById('jabatan')?.value || '',
            jenis_instansi: kategoriSelected === 'Khusus' ? 'Instansi / Lembaga' : 'Perorangan',
            nama_instansi: document.getElementById('namaInstansiLembaga')?.value || '', 
            tujuan: document.getElementById('tujuan')?.value || '',
            no_wa: document.getElementById('no_wa')?.value || '',
            saran: document.getElementById('saran')?.value || '',
            foto: photoDataInput.value
        };

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(payload),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        })
       .then(() => {
            // 1. Tampilkan pesan berhasil
            alert("Berhasil! Data buku tamu Anda telah tersimpan.");
            
            // 2. Reset formulir (opsional)
            form.reset();
            photoPreview.style.display = 'none';
            
            // 3. Arahkan user ke website Desa Kesiut
            window.location.href = "https://kesiut.desa.id/"; 
        })
        .catch(error => {
            console.error('Error:', error);
            alert("Gagal mengirim data. Pastikan koneksi internet Anda stabil.");
            submitBtn.innerText = "Kirim Data Kunjungan";
            submitBtn.disabled = false;
        });
    });
</script>

</body>
</html>
